allowBuilds:
  esbuild: true
  lefthook: false
  sharp: true
# Security patches for transitive dev dependencies (Dependabot advisories).
# Scoped to the affected major so no consumer is forced across a major. Each
# target is a caret range from a patched release. An exact version would hold
# every matched request on it, even after the next fix ships.
overrides:
  'brace-expansion@>=5.0.0 <5.0.12': '^5.0.13'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
