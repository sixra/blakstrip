version: 2
updates:
  # npm dependencies (pdf.js, pdf-lib, Astro, Svelte, Tailwind, tooling, ...).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
  # Keep the GitHub Actions in ci.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
