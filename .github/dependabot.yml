version: 2
updates:
  # npm dependencies (pdf.js, pdf-lib, Astro, Svelte, Tailwind, tooling, ...).
  # Note: @sixra/devkit is a `github:` git dependency and is not bumped by the
  # npm updater; that is expected.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
  # Keep the GitHub Actions in ci.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
